# Template contract tasks. The shared Rust toolchain lives at the parent
# templates/mise.toml and is inherited through mise's parent-config merge.

[tasks.install]
description = "Resolve and fetch Cargo dependencies"
run = "cargo fetch"

[tasks.build]
description = "Compile the application"
run = "cargo build"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.lint]
description = "Lint with clippy (deny warnings)"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."lint:fix"]
description = "Auto-fix clippy findings"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks.format]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check formatting without modifying files"
run = "cargo fmt --all --check"

[tasks.env-pull]
description = "Pull external environment configuration"
run = 'echo "env-pull: nothing to pull"'

[tasks."publish:setup"]
description = "Verify the crates.io token is ready for publication"
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  echo "publish:setup (test mode): crates.io token preflight skipped"
  exit 0
fi
if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
  echo "error: publish:setup requires the crates.io token in CARGO_REGISTRY_TOKEN" >&2
  exit 1
fi
echo "publish:setup: CARGO_REGISTRY_TOKEN is set (value not shown); ready for token-based publication"
'''

[tasks._publish]
description = "Publish this crate unless its version already exists"
hide = true
run = '''
set -eu
name="$(sed -n 's/^name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
code="$(curl -sS -o /dev/null -w '%{http_code}' -A premise-release-check \
  "https://crates.io/api/v1/crates/$name/$version" 2>/dev/null || true)"
if [ "$code" = "200" ]; then
  echo "skip: $name $version already published"
  exit 0
fi
cargo publish --allow-dirty --no-verify
'''

[tasks."publish:rc"]
description = "Publish a prerelease (rc) version of the crate"
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  echo "publish:rc (test mode): cargo publish --dry-run --allow-dirty"
  cargo publish --dry-run --allow-dirty
  exit 0
fi
version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
case "$version" in
  *-*) ;;
  *) echo "error: publish:rc requires a SemVer prerelease version (got $version)" >&2; exit 1 ;;
esac
mise run _publish
'''

[tasks.publish]
description = "Publish a stable version of the crate"
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  echo "publish (test mode): cargo publish --dry-run --allow-dirty"
  cargo publish --dry-run --allow-dirty
  exit 0
fi
version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
case "$version" in
  *-*) echo "error: publish requires a stable version (got $version)" >&2; exit 1 ;;
esac
mise run _publish
'''

[tasks.run]
description = "Run the application"
run = "cargo run"

[tasks.dev]
description = "Run the application in development mode"
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  cargo build
else
  cargo run
fi
'''

[tasks.deploy]
description = "Validate the deploy contract (no deployable surface)"
run = 'echo "deploy: no deployable surface"'

[tasks.e2e]
description = "Validate the e2e contract (no end-to-end surface)"
run = 'echo "e2e: no end-to-end surface"'
