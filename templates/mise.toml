# =============================================================================
# mise.toml — generated-client Rust toolchain
# =============================================================================
#
# Direct files under templates/ merge into the generated client workspace root.
# Selected templates own their package contract tasks under apps/ or libs/.

[tools]
rust = { version = "1.88", components = "rustfmt,clippy,rust-analyzer" }
"cargo:cargo-zigbuild" = "0.23.4"
zig = "0.16.0"
