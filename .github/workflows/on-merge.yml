---
name: On Merge

# Premise owns stable release planning, tagging, and publication. Reruns reuse a
# stable tag already at HEAD and skip crate/version pairs already on crates.io.
"on":
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: macos-14
    outputs:
      version: ${{ steps.premise.outputs.version }}
      should_publish: ${{ steps.premise.outputs.should_publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run on-merge flow
        id: premise
        uses: cloudvoyant/premise@v0.4.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          flow: on-merge
          install-premise: build

  tauri:
    name: Publish Tauri installers (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Install Tauri tools
        shell: bash
        working-directory: templates/premise-tauri-app
        run: mise install

      - name: Publish native installers
        shell: bash
        working-directory: templates/premise-tauri-app
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: mise run publish
