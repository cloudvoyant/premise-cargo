---
name: On Merge

# Premise owns stable release planning, tagging, and publication. Reruns reuse a
# stable tag already at HEAD and skip crate/version pairs already on crates.io.
"on":
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: macos-14
    environment: crates-io
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run on-merge flow
        uses: cloudvoyant/premise@120ba28d0305e8215f10bfcdcbc92fac2257e782
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          flow: on-merge
          install-premise: build
