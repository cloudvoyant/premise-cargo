---
name: On Merge

# Premise owns stable release planning, tagging, and publication. Reruns reuse a
# stable tag already at HEAD and skip crate/version pairs already on crates.io.
"on":
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: macos-14
    outputs:
      version: ${{ steps.premise.outputs.version }}
      should_publish: ${{ steps.premise.outputs.should_publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run on-merge flow
        id: premise
        uses: cloudvoyant/premise@v0.4.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          flow: on-merge
          install-premise: build

  platform-stable:
    name: Publish native stable installers
    needs: release
    if: needs.release.outputs.should_publish == 'true'
    permissions:
      contents: write
    uses: cloudvoyant/premise/.github/workflows/release-platform.yml@fix/diff-191-release-artifacts
    with:
      project: premise-tauri-app
      channel: stable
      version: ${{ needs.release.outputs.version }}
      premise-ref: fix/diff-191-release-artifacts
