---
name: On Merge

# Premise owns stable release planning, tagging, GitHub artifacts, and the
# language-package publication handoff. Reruns reuse the stable tag, replace
# conflicting GitHub assets, and skip crate/version pairs already on crates.io.
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: macos-14
    environment: crates-io
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run the Premise feature flow
        uses: cloudvoyant/premise@bd67902eb321aec80b0352b7f7c40ea526cb7ab2
        with:
          flow: feature
          build-premise-from-source: "true"

      - name: Test publication contract
        shell: bash
        run: scripts/test-publish-cargo.sh

      - name: Prepare stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pm release prepare

      - name: Publish GitHub binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pm release github

      - name: Publish stable crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: pm release packages
