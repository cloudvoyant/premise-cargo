---
name: On Merge

"on":
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  github-release:
    name: Validate and publish GitHub release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run GitHub on-merge flow
        uses: cloudvoyant/premise@120ba28d0305e8215f10bfcdcbc92fac2257e782
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          flow: on-merge
          release: github
          install-premise: build

  packages:
    name: Publish stable crates
    runs-on: ubuntu-latest
    needs: github-release
    environment: crates-io
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run package on-merge flow
        uses: cloudvoyant/premise@120ba28d0305e8215f10bfcdcbc92fac2257e782
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          flow: on-merge
          release: packages
          install-premise: build
