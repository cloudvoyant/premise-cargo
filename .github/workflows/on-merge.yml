---
name: On Merge

# Premise owns stable release planning, tagging, and publication. Reruns reuse a
# stable tag already at HEAD and skip crate/version pairs already on crates.io.
"on":
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: stable-release
  cancel-in-progress: false

# Temporary feature-branch premise-ref is retained only for draft testing.
# Merge is blocked until this is replaced with an immutable released tag.
jobs:
  flow:
    name: Run complete on-merge flow
    uses: cloudvoyant/premise/.github/workflows/release-platform.yml@fix/diff-191-release-artifacts
    secrets:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    with:
      flow: on-merge
      release: auto
      premise-ref: fix/diff-191-release-artifacts
      package-environment: crates-io
