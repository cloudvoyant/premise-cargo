---
name: On Commit

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test templates
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The premise composite action detects a repository-root premise.yaml
      # that declares templates and runs `pm template test` as the feature
      # flow's authoritative check. Pinned to the immutable commit that adds
      # `build-premise-from-source` and that template-registry detection.
      - name: Run the Premise feature flow
        uses: cloudvoyant/premise@224d47d356ed02a7aeb6a45bd1c8cf8fec944997
        with:
          flow: feature
          build-premise-from-source: "true"
