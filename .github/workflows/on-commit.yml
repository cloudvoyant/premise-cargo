---
name: On Commit

"on":
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and check formatting
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' ||
      github.event.before != '0000000000000000000000000000000000000000') &&
      !(github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[publish-rc]'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run on-commit flow
        uses: cloudvoyant/premise@v0
        with:
          flow: on-commit
          install-premise: build

  release-candidate:
    name: Test and publish release candidate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.event.before != '0000000000000000000000000000000000000000' &&
      contains(github.event.head_commit.message, '[publish-rc]')
    environment: crates-io-rc
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run on-commit flow and publish RC
        uses: cloudvoyant/premise@v0
        with:
          flow: on-commit
          install-premise: build
          cargo-token: ${{ secrets.CARGO_TOKEN }}
