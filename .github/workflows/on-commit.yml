---
name: On Commit

"on":
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  id-token: write

# Temporary feature-branch premise-ref is retained only for draft testing.
# Merge is blocked until this is replaced with an immutable released tag.
jobs:
  flow:
    name: Run complete on-commit flow
    uses: cloudvoyant/premise/.github/workflows/release-platform.yml@fix/diff-191-release-artifacts
    secrets:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    with:
      flow: on-commit
      release: auto
      premise-ref: fix/diff-191-release-artifacts
      package-environment: crates-io-rc
