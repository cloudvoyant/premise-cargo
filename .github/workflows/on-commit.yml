---
name: On Commit

"on":
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test templates
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.before !=
      '0000000000000000000000000000000000000000' &&
      !contains(github.event.head_commit.message, '[publish-rc]'))
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run on-commit flow
        uses: cloudvoyant/premise@120ba28d0305e8215f10bfcdcbc92fac2257e782
        with:
          flow: on-commit
          install-premise: build

  release-matrix:
    name: Test stable release matrix
    runs-on: macos-14
    needs: verify
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run release-matrix flow
        uses: cloudvoyant/premise@120ba28d0305e8215f10bfcdcbc92fac2257e782
        with:
          flow: on-merge
          release: none
          install-premise: build

  publish-rc:
    name: Validate and publish RC crates
    runs-on: ubuntu-latest
    environment: crates-io-rc
    concurrency:
      group: cargo-rc-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'push' &&
      github.event.before !=
      '0000000000000000000000000000000000000000' &&
      contains(github.event.head_commit.message, '[publish-rc]')
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run protected on-commit flow
        uses: cloudvoyant/premise@120ba28d0305e8215f10bfcdcbc92fac2257e782
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          flow: on-commit
          install-premise: build
