---
name: On Commit

"on":
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and check formatting
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event.before !=
      '0000000000000000000000000000000000000000'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run on-commit flow
        uses: cloudvoyant/premise@66368d413ef281ada1a101da13480e7e2125b686
        env:
          CARGO_REGISTRY_TOKEN: >-
            ${{ github.event_name == 'push' &&
            contains(github.event.head_commit.message, '[publish-rc]') &&
            secrets.CRATES_TOKEN || '' }}
        with:
          flow: on-commit
          install-premise: build
