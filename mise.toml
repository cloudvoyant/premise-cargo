# =============================================================================
# mise.toml — registry development environment
# =============================================================================
#
# This root is the Premise template registry and its aggregate Cargo workspace.
# Direct files under templates/ are generated-client root inputs, so shared Rust
# tools are declared both here for registry release work and in templates/mise.toml
# for generated clients. Each selected template owns its contract tasks.

[tools]
rust = { version = "1.88", components = "rustfmt,clippy,rust-analyzer" }
"cargo:cargo-zigbuild" = "0.23.4"
zig = "0.16.0"

[tasks."template-test"]
description = "Run every declared template through the Premise contract"
run = "pm template test"

[tasks.build]
description = "Validate registry structure"
run = '''
set -eu
for f in premise.yaml Cargo.toml Cargo.lock templates/mise.toml; do
  [ -f "$f" ] || { echo "error: missing $f" >&2; exit 1; }
done
echo "registry structure valid"
'''

[tasks.test]
description = "Run the registry contract (every declared template)"
run = "mise run template-test"

[tasks.format]
description = "Format registry mise configuration"
run = "mise fmt"

[tasks."format:check"]
description = "Check registry mise configuration formatting"
run = "mise fmt --check"

[tasks.lint]
description = "Validate registry configuration"
run = '''
set -eu
mise fmt --check
[ -f premise.yaml ] || { echo "error: missing premise.yaml" >&2; exit 1; }
echo "registry config valid"
'''

[tasks.clean]
description = "Remove registry artifacts"
run = "true"
