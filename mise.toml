# =============================================================================
# mise.toml — registry development environment
# =============================================================================
#
# This root owns the template registry and aggregate Cargo source workspace.
# Generated projects receive only files declared in premise.yaml under
# template_registry.workspace_files. Each template owns its tools and tasks.

monorepo_root = true

[monorepo]
config_roots = ["templates/premise-*", "apps/*", "libs/*"]

[tools]
rust = { version = "1.88", components = "rustfmt,clippy,rust-analyzer" }
"cargo:cargo-zigbuild" = "0.23.4"
"aqua:rhysd/actionlint" = "1.7.7"
zig = "0.16.0"

[tasks."template-test"]
description = "Run every declared template through the Premise contract"
run = "pm template test"

[tasks.build]
description = "Validate registry structure"
run = '''
set -eu
for f in premise.yaml Cargo.toml Cargo.lock; do
  [ -f "$f" ] || { echo "error: missing $f" >&2; exit 1; }
done
echo "registry structure valid"
'''

[tasks.test]
description = "Run release and registry contracts"
run = "mise run template-test"

[tasks.format]
description = "Format registry mise configuration"
run = "mise fmt"

[tasks."format:check"]
description = "Check registry mise configuration formatting"
run = "mise fmt --check"

[tasks.lint]
description = "Validate registry and workflow configuration"
run = '''
set -eu
mise fmt --check
actionlint
[ -f premise.yaml ] || { echo "error: missing premise.yaml" >&2; exit 1; }
echo "registry config valid"
'''

[tasks.clean]
description = "Remove registry artifacts"
run = "true"
