# =============================================================================
# mise.toml — registry development environment
# =============================================================================
#
# This root is the Premise template registry. It installs no language or
# release toolchain and runs no Rust build, format, or lint commands. Shared
# Rust tooling and build tasks live only at templates/mise.toml; Premise owns
# version and release tooling.

[tasks."template-test"]
description = "Run every declared template through the Premise contract"
run = "pm template test"

[tasks.on-commit]
description = "Validate the registry and every template contract"
run = '''
set -eu
mise run build
mise run test
mise run format:check
mise run lint
'''

[tasks.on-merge]
description = "Validate the registry and stable release matrix"
run = '''
set -eu
mise run on-commit
pm release snapshot
'''

[tasks.build]
description = "Validate registry structure"
run = '''
set -eu
for f in premise.yaml templates/mise.toml; do
  [ -f "$f" ] || { echo "error: missing $f" >&2; exit 1; }
done
echo "registry structure valid"
'''

[tasks.test]
description = "Run the registry contract (every declared template)"
run = "mise run template-test"

[tasks.format]
description = "Format registry mise configuration"
run = "mise fmt"

[tasks."format:check"]
description = "Check registry mise configuration formatting"
run = "mise fmt --check"

[tasks.lint]
description = "Validate registry configuration"
run = '''
set -eu
mise fmt --check
[ -f premise.yaml ] || { echo "error: missing premise.yaml" >&2; exit 1; }
echo "registry config valid"
'''

[tasks.clean]
description = "Remove registry artifacts"
run = "true"

[tasks."publish:setup"]
description = "Aggregate per-package crates.io token preflights"
run = '''
set -eu
for pkg in premise-rust-lib premise-rust-app premise-clap-cli premise-ratatui-app; do
  echo "publish:setup: $pkg"
  (cd "templates/$pkg" && mise run publish:setup)
done
'''

[tasks."_publish-packages"]
description = "Synchronize disposable package versions and run each package publish task"
hide = true
run = '''
set -eu
version="${RELEASE_VERSION:-}"
task="${RELEASE_TASK:-}"
version="${version#v}"
if [ -z "$version" ] || { [ "$task" != "publish:rc" ] && [ "$task" != "publish" ]; }; then
  echo "error: package publication requires RELEASE_VERSION and RELEASE_TASK" >&2
  exit 1
fi
packages="premise-rust-lib premise-rust-app premise-clap-cli premise-ratatui-app"
templates="$PWD/templates"
backup_dir="$(mktemp -d "${TMPDIR:-/tmp}/premise-cargo-publish.XXXXXX")"
for pkg in $packages; do
  cp "$templates/$pkg/Cargo.toml" "$backup_dir/$pkg.Cargo.toml"
done
cp "$templates/Cargo.lock" "$backup_dir/Cargo.lock"
restore_versions() {
  status=$?
  trap - EXIT
  set +e
  for pkg in $packages; do
    cp "$backup_dir/$pkg.Cargo.toml" "$templates/$pkg/Cargo.toml"
  done
  cp "$backup_dir/Cargo.lock" "$templates/Cargo.lock"
  rm -rf "$backup_dir"
  exit "$status"
}
trap restore_versions EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
for pkg in $packages; do
  sed -i.bak "s/^version = \"[^\"]*\"/version = \"$version\"/" "$templates/$pkg/Cargo.toml"
  rm -f "$templates/$pkg/Cargo.toml.bak"
done
(
  cd "$templates"
  mise exec -- cargo generate-lockfile
)
for pkg in $packages; do
  echo "$task: $pkg $version"
  (
    cd "$templates/$pkg"
    RELEASE_VERSION="$version" mise run "$task"
  )
done
'''

[tasks."publish:rc"]
description = "Publish one release-candidate version through every package task"
run = '''
set -eu
version="${RELEASE_VERSION:-}"
case "$version" in
  *-*) ;;
  *) echo "error: publish:rc requires a prerelease RELEASE_VERSION" >&2; exit 1 ;;
esac
mise run publish:setup
RELEASE_TASK=publish:rc mise run _publish-packages
'''

[tasks.publish]
description = "Publish one stable version through every package task"
run = '''
set -eu
version="${RELEASE_VERSION:-}"
case "$version" in
  ""|*-*) echo "error: publish requires a stable RELEASE_VERSION" >&2; exit 1 ;;
esac
mise run publish:setup
RELEASE_TASK=publish mise run _publish-packages
'''
