workspace:
  name: premise-cargo
  kind: template-registry
  schema-version: "0.1"
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: none
    versioning: svu
  projects: []
templates:
  - name: premise-rust-lib
    kind: lib
    questions:
      - prompt: "Library name:"
        type: string
        populate: name
    substitutions:
      premise-rust-lib: name
  - name: premise-rust-app
    kind: app
    questions:
      - prompt: "App name:"
        type: string
        populate: name
    substitutions:
      premise-rust-app: name
  - name: premise-clap-cli
    kind: app
    questions:
      - prompt: "App name:"
        type: string
        populate: name
    substitutions:
      premise-clap-cli: name
  - name: premise-ratatui-app
    kind: app
    questions:
      - prompt: "App name:"
        type: string
        populate: name
    substitutions:
      premise-ratatui-app: name
