workspace:
  name: premise-cargo
  kind: template-registry
  schema-version: "0.2"
  package_managers:
    - cargo
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: none
    versioning: svu
  projects: []
template_registry:
  workspace_files:
    - .gitignore
  templates:
    - name: premise-rust-lib
      kind: lib
      path: templates/premise-rust-lib
      questions:
        - prompt: "Library name:"
          type: string
          populate: name
      substitutions:
        premise-rust-lib: name
    - name: premise-rust-app
      kind: app
      path: templates/premise-rust-app
      questions:
        - prompt: "App name:"
          type: string
          populate: name
      substitutions:
        premise-rust-app: name
    - name: premise-clap-cli
      kind: app
      path: templates/premise-clap-cli
      questions:
        - prompt: "App name:"
          type: string
          populate: name
      substitutions:
        premise-clap-cli: name
    - name: premise-ratatui-app
      kind: app
      path: templates/premise-ratatui-app
      questions:
        - prompt: "App name:"
          type: string
          populate: name
      substitutions:
        premise-ratatui-app: name
    - name: premise-tauri-app
      kind: app
      path: templates/premise-tauri-app
      questions:
        - prompt: "App name:"
          type: string
          populate: name
        - prompt: "Bundle identifier:"
          type: string
          populate: identifier
      substitutions:
        premise-tauri-app: name
        com.premise.tauri-app: identifier
